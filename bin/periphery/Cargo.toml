[package]
name = "komodo_periphery"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "periphery"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Build OpenSSL 3 from source instead of linking the system one, so the binary can be
# built on bullseye (OpenSSL 1.1, glibc 2.31) and still run on every host in the fleet.
# Only the CI job that publishes to doc.data.vici.corp turns this on — the Docker images
# build on bookworm and keep using the system OpenSSL 3.
vendored-openssl = ["dep:openssl"]

[dependencies]
# local
komodo_client = { workspace = true, features = ["periphery"] }
periphery_client.workspace = true
environment.workspace = true
interpolate.workspace = true
mogh_server.workspace = true
mogh_secret_file.workspace = true
formatting.workspace = true
transport.workspace = true
encoding.workspace = true
command.workspace = true
mogh_config.workspace = true
mogh_logger.workspace = true
mogh_cache.workspace = true
mogh_pki.workspace = true
git.workspace = true
# mogh
mogh_error = { workspace = true, features = ["axum"] }
async_timing_util.workspace = true
mogh_resolver.workspace = true
svi.workspace = true
# external
# Never used in code — pulled in only so `vendored-openssl` can flip
# openssl-sys/vendored on the copy webauthn-rs already brings in.
openssl = { version = "0.10", features = ["vendored"], optional = true }
hickory-resolver.workspace = true
serde_yaml_ng.workspace = true
data-encoding.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
portable-pty.workspace = true
shell-escape.workspace = true
urlencoding.workspace = true
serde_json.workspace = true
tokio-util.workspace = true
arc-swap.workspace = true
colored.workspace = true
tracing.workspace = true
bollard.workspace = true
sysinfo.workspace = true
dotenvy.workspace = true
anyhow.workspace = true
rustls.workspace = true
bytes.workspace = true
serde.workspace = true
shlex.workspace = true
strum.workspace = true
tokio.workspace = true
axum.workspace = true
clap.workspace = true
envy.workspace = true
uuid.workspace = true
